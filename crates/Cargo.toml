[workspace]
resolver = "2"
members = [
    "core",
    "sdk",
    "kernel",
    "process",
    "wasm",
    "wasm-guest",
    "xtask",
    "plugins/skeleton-llm",
    "plugins/skeleton-tools",
    "plugins/echo-dylib",
    "demo",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
version = "0.1.2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["full"] }
arc-swap = "1"
petgraph = "0.6"
toml = "0.8"
schemars = "0.8"
agent-kernel-core = { path = "core" }
agent-kernel-sdk = { path = "sdk" }
agent-kernel-kernel = { path = "kernel" }
agent-kernel-process = { path = "process" }
agent-kernel-wasm = { path = "wasm" }
